# Packages whose install scripts may run. pnpm blocks all others.
# electron has no install script since v44; the dev/build/start/dist scripts
# download its binary via scripts/ensure-electron.mjs.
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true
patchedDependencies:
  monaco-editor@0.57.0: patches/monaco-editor@0.57.0.patch
# Monaco pins DOMPurify. Its ESM bundled copy is updated in the patch above.
overrides:
  monaco-editor>dompurify: 3.4.17
