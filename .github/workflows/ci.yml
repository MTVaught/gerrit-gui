# Checks every pull request before it can be merged. Nothing here signs,
# notarizes or publishes; that is the Release workflow, which runs after
# the merge. Secrets are never used, so the workflow is safe on pull
# requests from forks.
#
# Jobs:
#   checks       - typecheck, unit tests, electron-vite build, the integration
#                  test against a real Gerrit 3.11 in a service container, and
#                  lint of the workflows and release scripts.
#   version      - the package.json version, so the build runs with an explicit
#                  version like the Release workflow does. (No pull-request
#                  suffix: electron-builder turns a prerelease part into an
#                  update channel and renames the latest*.yml manifests.)
#   build        - the same reusable Build workflow the Release workflow uses,
#                  unsigned, on Linux, macOS and Windows.
#   publish-dry-run - the Release workflow's release job up to the point where
#                  it would talk to GitHub: download the artifacts, check the
#                  file set and run the publish script with DRY_RUN=true.
#
# GitHub does not run this workflow on a pull request with a merge conflict;
# merge-check.yml reports that case as a failure.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run for the old commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # The same image and settings as the "Tests" section of README.md. The
      # image defaults to DEVELOPMENT_BECOME_ANY_ACCOUNT, which the seed
      # script needs to create users and set HTTP passwords.
      gerrit:
        image: gerritcodereview/gerrit:3.11.2
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v7

      # Workflow files and the release scripts are only ever exercised on
      # main, so a syntax or shell mistake in them must be caught here.
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Lint shell scripts
        run: shellcheck -S warning scripts/*.sh test/*.sh
      - name: Test version picking
        run: test/pick-version.test.sh

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Gerrit takes a minute or two to initialise on first start. The seed
      # script waits for it, and the timeout stops a broken container from
      # holding the job open for the six-hour default.
      - name: Seed Gerrit
        run: timeout 600 ./test/seed-gerrit.sh

      # The test skips itself when Gerrit is unreachable. In CI that must be a
      # failure, so check the server first and make node fail on a skip.
      - name: Integration test
        run: |
          set -euo pipefail
          curl -sf -o /dev/null http://localhost:8080/config/server/version
          out=$(pnpm test:integration 2>&1 | tee /dev/stderr)
          if grep -Eq '^(ℹ|#) skipped [1-9]' <<<"$out"; then
            echo 'integration test skipped: Gerrit was unreachable' >&2
            exit 1
          fi
        env:
          GERRIT_TEST_URL: http://localhost:8080

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, version]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: false

  publish-dry-run:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      # Same order as the release job in release.yml: checkout first, because
      # checkout empties the workspace and would delete downloaded artifacts.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Check release files
        run: scripts/check-release-assets.sh --exact '${{ needs.version.outputs.version }}' artifacts

      - name: Publish release (dry run)
        run: scripts/publish-release.sh
        env:
          DRY_RUN: 'true'
          GH_TOKEN: none
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
          TARGET: ${{ github.sha }}
          ASSETS_DIR: artifacts
          KEEP_DRAFT: 'true'
