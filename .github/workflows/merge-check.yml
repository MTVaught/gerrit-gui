# Turns a silent skip into a visible failure. GitHub runs no pull_request
# workflow on a pull request that has a merge conflict, so the CI workflow
# just does not appear and the pull request looks untested rather than
# broken. pull_request_target has no such rule: it runs from the base branch
# and never needs the merge commit, so it fires on a conflicted pull request
# too. This job only reads the pull request through the API. It never checks
# out or runs code from the pull request, which is what makes
# pull_request_target safe to use here.
name: Merge check

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conflict:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the pull request has a merge conflict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # GitHub computes mergeability in the background after a push and
          # reports null until it is done, so poll for up to a minute.
          for _ in $(seq 1 12); do
            read -r mergeable base < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.mergeable) \(.base.ref)"')
            [ "$mergeable" != null ] && break
            sleep 5
          done
          case "$mergeable" in
            true) echo "Pull request #$PR merges cleanly into $base." ;;
            false)
              echo "::error::Pull request #$PR has a merge conflict with $base. GitHub runs no CI on a conflicted pull request. Rebase onto $base (or merge it in), resolve the conflict and push again."
              exit 1 ;;
            *)
              echo "::error::GitHub had not computed mergeability for pull request #$PR after a minute. Re-run this check."
              exit 1 ;;
          esac
