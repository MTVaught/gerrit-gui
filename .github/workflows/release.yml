# Builds the packaged application for every platform and attaches the
# installers to a GitHub release, together with what the in-app updater
# reads: the latest*.yml manifests, the macOS zip archives and the blockmaps.
#
# Runs on every push to main (a merged pull request), on a version tag
# (v1.2.3), or by hand. A push to main picks the version itself
# (scripts/pick-version.sh): the version in package.json when it is newer
# than every tag, otherwise a patch bump of the newest v* tag. GitHub creates
# the tag when the release is published. Tags created by the workflow token
# do not start another run, so this does not loop.
#
# The build is the reusable Build workflow that CI also runs on every pull
# request, here with signing on. macOS builds are signed with the Developer ID
# certificate in CSC_LINK and notarized with the App Store Connect API key in
# APPLE_API_KEY. Linux and Windows builds are not signed. Secrets are never
# exposed to pull requests.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Runs on the same ref go one at a time, so two merges close together cannot
# both compute the same next version. A queued run is replaced by a newer
# one; the newest commit always gets a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      draft: ${{ steps.pick.outputs.draft }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick version
        id: pick
        # pipefail so a failure in the script is not hidden behind tee.
        shell: bash
        run: scripts/pick-version.sh | tee -a "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: true
    secrets: inherit

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout must come first: it empties the workspace, and would delete
      # artifacts downloaded before it. That order broke two releases.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Every file for every platform, and nothing else, before any upload.
      - name: Check release files
        run: scripts/check-release-assets.sh --exact '${{ needs.version.outputs.version }}' artifacts

      # Uploads one asset at a time with retries, checks every file landed,
      # then publishes. A draft left by an earlier failed run for the same tag
      # is reused and retargeted at this commit.
      - name: Publish release
        run: scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ github.sha }}
          ASSETS_DIR: artifacts
          KEEP_DRAFT: ${{ needs.version.outputs.draft }}
