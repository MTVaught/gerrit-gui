# Builds the packaged application on Linux, macOS and Windows and uploads the
# release files of each platform as an artifact named after the runner OS.
#
# This is a reusable workflow. CI calls it on every pull request with
# sign: false, and Release calls it on main with sign: true. The steps are the
# same in both, so a change that breaks packaging or leaves a release file out
# fails on the pull request rather than after the merge.
#
# With sign: true the macOS build is signed with the Developer ID certificate
# in CSC_LINK and notarized with the App Store Connect API key in
# APPLE_API_KEY, and the caller must pass secrets: inherit. Linux and Windows
# builds are never signed.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the packaged app and its file names
        type: string
        required: true
      sign:
        description: Sign and notarize the macOS build (needs the Apple secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    # Git Bash on Windows too. PowerShell splits an argument such as
    # -c.extraMetadata.version=1.2.3 at the dot, which broke the Package step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      # notarytool takes the App Store Connect key as a file path, so write
      # the secret (the raw .p8 text) to the runner's temp dir first.
      - name: Write App Store Connect API key
        if: inputs.sign && matrix.platform == 'mac'
        run: |
          set -e
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          head -c 27 "$RUNNER_TEMP/AuthKey.p8" | grep -q -- '-----BEGIN PRIVATE KEY-----' \
            || { echo 'APPLE_API_KEY secret is not a PEM .p8 (expected raw key text, not base64)'; exit 1; }
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}

      # --publish never: electron-builder otherwise tries to upload to GitHub
      # itself whenever it detects CI, and fails without GH_TOKEN. The Release
      # workflow does the upload.
      # extraMetadata.version sets the version in the packaged app and the
      # file names without editing package.json, so the build-commit stamp
      # does not show the tree as dirty.
      # Signed: electron-builder decodes CSC_LINK into a temporary keychain,
      # signs with hardened runtime, submits to notarytool and staples the
      # ticket. Unsigned: CSC_IDENTITY_AUTO_DISCOVERY=false stops it from
      # looking for a signing identity on the macOS runner, and with no Apple
      # credentials in the environment it also skips notarization.
      - name: Package
        run: pnpm dist --${{ matrix.platform }} --publish never --config.extraMetadata.version=${{ inputs.version }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.sign && 'true' || 'false' }}
          CSC_LINK: ${{ inputs.sign && matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.sign && matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ inputs.sign && matrix.platform == 'mac' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ inputs.sign && matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.sign && matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}

      - name: Verify notarization
        if: inputs.sign && matrix.platform == 'mac'
        run: |
          set -e
          for app in dist/mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      # Every file the release and the in-app updater need for this platform
      # must be there. A missing blockmap or manifest would otherwise publish
      # and break updates for one platform.
      - name: Check release files
        run: scripts/check-release-assets.sh '${{ inputs.version }}' dist ${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
